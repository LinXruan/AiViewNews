<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AiViewNews</title>
  <link rel="stylesheet" href="/static/style.css?v=18" />
  <link rel="stylesheet" href="/static/history.css?v=18" />
  <link rel="stylesheet" href="/static/records.css?v=18" />
  <link rel="stylesheet" href="/static/reader.css?v=18" />
  <link rel="stylesheet" href="/static/layout.css?v=18" />
  <link rel="stylesheet" href="/static/report.css?v=18" />
</head>
<body>
  <section class="auth-screen" id="auth-screen" hidden>
    <div class="auth-wordmark">AiViewNews</div>
    <div class="auth-card">
      <div class="auth-tabs">
        <button type="button" class="active" data-auth="login">登录</button>
        <button type="button" data-auth="register">注册</button>
      </div>
      <form id="login-form" class="auth-form">
        <input name="username" placeholder="用户名" autocomplete="username" required />
        <input name="password" type="password" placeholder="密码" autocomplete="current-password" required />
        <button type="submit" class="primary-btn">登录</button>
      </form>
      <form id="register-form" class="auth-form" hidden>
        <input name="username" placeholder="用户名（3-32 位）" autocomplete="username" minlength="3" required />
        <input name="password" type="password" placeholder="密码（至少 6 位）" autocomplete="new-password" minlength="6" required />
        <input name="confirm" type="password" placeholder="确认密码" autocomplete="new-password" minlength="6" required />
        <button type="submit" class="primary-btn">注册并进入</button>
      </form>
      <form id="setup-form" class="auth-form" hidden>
        <p class="muted">系统还没有管理员，请创建第一个管理员。</p>
        <input name="username" placeholder="管理员用户名" minlength="3" required />
        <input name="password" type="password" placeholder="密码（至少 6 位）" minlength="6" required />
        <input name="confirm" type="password" placeholder="确认密码" minlength="6" required />
        <button type="submit" class="primary-btn">创建管理员</button>
      </form>
      <p class="error" id="auth-error" hidden></p>
      <div class="auth-foot">
        <button type="button" class="link-btn" id="guest-btn">不登陆</button>
        <button type="button" class="link-btn" id="setup-link" hidden>创建管理员</button>
      </div>
    </div>
  </section>

  <div class="workspace" id="workspace" hidden>
    <aside class="history-rail" id="history-rail">
      <div class="rail-head">
        <span class="wordmark" id="rail-wordmark">AiViewNews</span>
        <div class="rail-actions">
          <button type="button" class="icon-btn" id="history-search-toggle" title="搜索">⌕</button>
          <button type="button" class="icon-btn" id="history-collapse" title="收起侧边栏">«</button>
        </div>
      </div>
      <div class="search-box" id="search-box" hidden>
        <input id="history-search" placeholder="搜索标题或问题" />
      </div>
      <button type="button" class="new-history" id="new-history">＋ 新建</button>
      <div class="history-list" id="history-list"></div>
      <div class="account-box" id="account-box">
        <button type="button" class="account-button" id="account-button">
          <span class="avatar" id="avatar">A</span>
          <span class="account-name" id="account-name"></span>
        </button>
        <div class="account-menu" id="account-menu" hidden>
          <button type="button" id="account-settings">设置</button>
          <button type="button" id="account-logout">退出</button>
        </div>
      </div>
    </aside>

    <aside class="record-rail" id="record-rail" hidden>
      <div class="rail-head">
        <button type="button" class="ghost-btn" id="records-toggle">记录</button>
        <button type="button" class="icon-btn" id="record-collapse" title="收起侧边栏2">«</button>
      </div>
      <div class="record-list" id="record-list" hidden></div>
      <form id="query-form" class="query-form">
        <textarea id="query-input" rows="4" placeholder="分析燃油价格对行业的影响"></textarea>
        <button type="submit" class="run-btn" id="query-run" title="开始查询">▶</button>
      </form>
      <p class="error" id="query-error" hidden></p>
      <p class="timeline-summary" id="timeline-summary" hidden></p>
      <div class="timeline" id="timeline"></div>
      <p class="muted small" id="timeline-hint"></p>
    </aside>

    <main class="reader" id="reader">
      <div class="upload-pane" id="upload-pane">
        <label class="upload-card" for="pdf-input">
          <span class="upload-plus">＋</span>
          <strong>上传 PDF</strong>
          <span class="muted">一次可选择多个文件，解析完成后生成历史记录</span>
        </label>
        <input id="pdf-input" type="file" accept=".pdf,application/pdf" multiple hidden />
        <p class="muted" id="upload-status"></p>
      </div>
      <div class="reader-pane" id="reader-pane" hidden>
        <div class="reader-head">
          <div class="doc-tabs" id="doc-tabs"></div>
          <button type="button" class="primary-btn" id="save-btn" disabled>保存</button>
        </div>
        <div class="reader-body" id="reader-body"></div>
        <section class="summary-panel" id="summary-panel" hidden>
          <div class="summary-head">
            <span id="summary-title"></span>
            <button type="button" class="icon-btn" id="summary-close">×</button>
          </div>
          <div class="summary-body" id="summary-body"></div>
        </section>
      </div>
    </main>
  </div>

  <section class="report-screen" id="report-screen" hidden>
    <header class="report-head">
      <button type="button" class="ghost-btn" id="report-back">← 返回</button>
      <strong>分析报告</strong>
      <div class="report-actions">
        <button type="button" class="primary-btn" id="report-save">保存</button>
        <a class="ghost-btn" id="report-export" href="#">下载 DOC</a>
      </div>
    </header>
    <p class="muted" id="report-status"></p>
    <div class="report-grid">
      <textarea id="report-editor" spellcheck="false" placeholder="报告内容将在这里显示，可直接编辑 Markdown。"></textarea>
      <article class="report-preview" id="report-preview"></article>
    </div>
  </section>

  <div class="modal" id="account-modal" hidden>
    <div class="modal-card">
      <h2>账号设置</h2>
      <form id="password-form" class="stack">
        <input name="old_password" type="password" placeholder="旧密码" required />
        <input name="new_password" type="password" placeholder="新密码（至少 6 位）" minlength="6" required />
        <input name="confirm_password" type="password" placeholder="确认新密码" minlength="6" required />
        <button type="submit" class="primary-btn">修改密码</button>
      </form>
      <p class="error" id="password-error" hidden></p>
      <div class="modal-actions">
        <button type="button" class="danger-btn" id="delete-account">注销账号</button>
        <button type="button" class="ghost-btn" id="account-modal-close">关闭</button>
      </div>
    </div>
  </div>

  <script src="/static/app.js?v=18"></script>
  <script src="/static/auth.js?v=18"></script>
  <script src="/static/views/history.js?v=18"></script>
  <script src="/static/views/upload.js?v=18"></script>
  <script src="/static/views/records.js?v=18"></script>
  <script src="/static/views/reader.js?v=18"></script>
  <script src="/static/views/report.js?v=18"></script>
  <script src="/static/views/account.js?v=18"></script>
</body>
</html>
