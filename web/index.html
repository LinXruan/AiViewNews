<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AiViewNews</title>
  <link rel="stylesheet" href="/static/style.css?v=27" />
  <link rel="stylesheet" href="/static/auth.css?v=27" />
  <link rel="stylesheet" href="/static/history.css?v=27" />
  <link rel="stylesheet" href="/static/records.css?v=27" />
  <link rel="stylesheet" href="/static/reader.css?v=27" />
  <link rel="stylesheet" href="/static/layout.css?v=27" />
  <link rel="stylesheet" href="/static/report.css?v=27" />
  <link rel="stylesheet" href="/static/admin.css?v=27" />
  <link rel="stylesheet" href="/static/settings.css?v=27" />
</head>
<body>
  <section class="auth-screen" id="auth-screen" hidden>
    <div class="auth-wordmark">AiViewNews</div>
    <div class="auth-card">
      <div class="auth-tabs">
        <button type="button" class="active" data-auth="login">登录</button>
        <button type="button" data-auth="register">注册</button>
      </div>
      <form id="login-form" class="auth-form">
        <input name="username" placeholder="用户名" autocomplete="username" required />
        <input name="password" type="password" placeholder="密码" autocomplete="current-password" required />
        <button type="submit" class="primary-btn">登录</button>
      </form>
      <form id="register-form" class="auth-form" hidden>
        <input name="username" placeholder="用户名（3-32 位）" autocomplete="username" minlength="3" required />
        <input name="password" type="password" placeholder="密码（至少 6 位）" autocomplete="new-password" minlength="6" required />
        <input name="confirm" type="password" placeholder="确认密码" autocomplete="new-password" minlength="6" required />
        <button type="submit" class="primary-btn">注册并进入</button>
      </form>
      <form id="setup-form" class="auth-form" hidden>
        <p class="muted">系统还没有管理员，请创建第一个管理员。</p>
        <input name="username" placeholder="管理员用户名" minlength="3" required />
        <input name="password" type="password" placeholder="密码（至少 6 位）" minlength="6" required />
        <input name="confirm" type="password" placeholder="确认密码" minlength="6" required />
        <button type="submit" class="primary-btn">创建管理员</button>
      </form>
      <p class="error" id="auth-error" hidden></p>
      <div class="auth-foot">
        <button type="button" class="guest-btn" id="guest-btn">不登陆</button>
        <button type="button" class="link-btn" id="setup-link" hidden>创建管理员</button>
        <p class="auth-note">不登陆系统会自动清理历史记录</p>
      </div>
    </div>
  </section>

  <div class="workspace" id="workspace" hidden>
    <aside class="history-rail" id="history-rail">
      <div class="rail-resize" data-resize="history" title="拖动调整宽度"></div>
      <div class="rail-head">
        <span class="wordmark" id="rail-wordmark">AiViewNews</span>
        <div class="rail-actions">
          <button type="button" class="icon-btn" id="history-search-toggle" title="搜索">⌕</button>
          <button type="button" class="icon-btn" id="history-collapse" title="收起侧边栏">«</button>
        </div>
      </div>
      <div class="search-box" id="search-box" hidden>
        <input id="history-search" placeholder="搜索标题或问题" />
      </div>
      <button type="button" class="new-history" id="new-history">＋ 新建</button>
      <div class="history-list" id="history-list"></div>
      <div class="account-box" id="account-box">
        <button type="button" class="account-button" id="account-button">
          <span class="avatar" id="avatar">A</span>
          <span class="account-name" id="account-name"></span>
        </button>
      </div>
    </aside>

    <aside class="record-rail" id="record-rail" hidden>
      <div class="rail-resize" data-resize="records" title="拖动调整宽度"></div>
      <div class="rail-head rail-head-end">
        <div class="rail-actions">
          <button type="button" class="icon-btn" id="records-toggle" title="记录">
            <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true">
              <circle cx="10" cy="10" r="7.4" fill="none" stroke="currentColor" stroke-width="1.6" />
              <path d="M10 5.6V10l2.9 1.8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
            </svg>
          </button>
          <button type="button" class="icon-btn" id="record-collapse" title="收起侧边栏2">«</button>
        </div>
      </div>
      <div class="record-list" id="record-list" hidden></div>
      <form id="query-form" class="query-form">
        <div class="query-resize" data-resize="query" title="拖动调整高度"></div>
        <textarea id="query-input" rows="4" placeholder="分析燃油价格对行业的影响"></textarea>
        <button type="submit" class="run-btn" id="query-run" title="开始查询">▶</button>
      </form>
      <p class="error" id="query-error" hidden></p>
      <p class="timeline-summary" id="timeline-summary" hidden></p>
      <div class="timeline" id="timeline"></div>
      <p class="muted small" id="timeline-hint"></p>
    </aside>

    <main class="reader" id="reader">
      <div class="upload-pane" id="upload-pane">
        <label class="upload-card" for="pdf-input">
          <span class="upload-plus">＋</span>
          <strong>上传 PDF</strong>
          <span class="muted">一次可选择多个文件，解析完成后生成历史记录</span>
        </label>
        <input id="pdf-input" type="file" accept=".pdf,application/pdf" multiple hidden />
        <p class="muted" id="upload-status"></p>
      </div>
      <div class="reader-pane" id="reader-pane" hidden>
        <div class="reader-head">
          <div class="doc-tabs" id="doc-tabs"></div>
          <button type="button" class="primary-btn" id="save-btn" disabled>报告</button>
        </div>
        <div class="reader-body" id="reader-body"></div>
        <section class="summary-panel" id="summary-panel" hidden>
          <div class="summary-resize" id="summary-resize" data-resize="summary" title="拖动调整高度"></div>
          <div class="summary-head">
            <span id="summary-title"></span>
            <button type="button" class="icon-btn" id="summary-close">×</button>
          </div>
          <div class="summary-body" id="summary-body"></div>
        </section>
      </div>
    </main>
  </div>

  <div class="account-menu" id="account-menu" hidden>
    <button type="button" id="account-settings">设置</button>
    <button type="button" id="account-logout">退出</button>
  </div>
  <div class="modal center" id="settings-modal" hidden>
    <div class="modal-card settings-card">
      <div class="settings-head">
        <h2>设置</h2>
        <button type="button" class="icon-btn" id="settings-close" title="关闭">×</button>
      </div>
      <div class="settings-options">
        <button type="button" class="settings-option" id="settings-console" hidden>
          <span class="settings-option-text">
            <span class="settings-option-title">控制台</span>
            <span class="settings-option-hint">用户、任务与系统配置</span>
          </span>
          <span class="settings-option-arrow">›</span>
        </button>
        <button type="button" class="settings-option" id="settings-account">
          <span class="settings-option-text">
            <span class="settings-option-title">注销与密码</span>
            <span class="settings-option-hint">修改密码或注销账号</span>
          </span>
          <span class="settings-option-arrow">›</span>
        </button>
        <button type="button" class="settings-option" id="settings-personal">
          <span class="settings-option-text">
            <span class="settings-option-title">个性化</span>
            <span class="settings-option-hint">更改头像背景色</span>
          </span>
          <span class="settings-option-arrow">›</span>
        </button>
      </div>
    </div>
  </div>
  <div class="modal center" id="personal-modal" hidden>
    <div class="modal-card settings-card">
      <div class="settings-head">
        <h2>个性化</h2>
        <button type="button" class="icon-btn" id="personal-close" title="关闭">×</button>
      </div>
      <button type="button" class="personal-row" id="avatar-color-toggle">
        <span class="personal-row-label">更改头像背景色</span>
        <span class="color-dot" id="avatar-color-dot"></span>
        <span class="row-chevron">›</span>
      </button>
      <div class="palette" id="avatar-palette" hidden>
        <div class="palette-grid" id="palette-grid"></div>
        <label class="palette-custom">
          <span>自定义颜色</span>
          <input type="color" id="avatar-color-input" />
        </label>
        <div class="palette-preview">
          <span class="avatar" id="avatar-color-preview">A</span>
          <code id="avatar-color-value">#2563eb</code>
        </div>
        <p class="muted small" id="personal-status"></p>
      </div>
    </div>
  </div>

  <section class="admin-screen" id="admin-screen" hidden>
    <header class="admin-head">
      <button type="button" class="ghost-btn" id="admin-back">← 返回</button>
      <strong>控制台</strong>
      <span class="muted" id="admin-owner"></span>
    </header>
    <div class="admin-scroll">
      <section class="admin-card">
        <div class="admin-card-head">
          <h2>系统设置</h2>
          <span class="muted">保存后立即生效，无需重启</span>
        </div>
        <form id="settings-form" class="settings-grid" novalidate>
          <label class="field wide">
            <span>大模型接口地址（OpenAI 兼容）</span>
            <input id="set-base-url" required />
          </label>
          <label class="field">
            <span>模型名称</span>
            <input id="set-model" required />
          </label>
          <label class="field">
            <span>API Key（留空表示不修改）</span>
            <input id="set-api-key" type="password" autocomplete="new-password" />
          </label>
          <label class="field">
            <span>温度</span>
            <input id="set-temperature" type="number" min="0" max="2" step="0.1" />
          </label>
          <label class="field">
            <span>超时（秒）</span>
            <input id="set-timeout" type="number" min="5" max="600" step="5" />
          </label>
          <label class="field wide">
            <span>mineru 可执行文件路径</span>
            <input id="set-mineru-cmd" placeholder="例如 D:/.../envs/mineru/Scripts/mineru.exe" />
          </label>
          <label class="field wide">
            <span>Pandoc 可执行文件路径（导出 DOCX）</span>
            <input id="set-pandoc" placeholder="例如 C:/Program Files/Pandoc/pandoc.exe" />
          </label>
          <label class="field">
            <span>解析档位</span>
            <select id="set-tier">
              <option value="flash">flash（纯文本，低内存）</option>
              <option value="basic">basic（需要本地模型）</option>
              <option value="standard">standard（需要本地模型）</option>
              <option value="advanced">advanced（需要本地模型）</option>
            </select>
          </label>
          <div class="settings-actions">
            <button type="submit" class="primary-btn">保存设置</button>
            <button type="button" class="ghost-btn" id="settings-test-llm">测试大模型</button>
            <button type="button" class="ghost-btn" id="settings-detect">自动探测 mineru</button>
            <button type="button" class="ghost-btn" id="settings-detect-pandoc">自动探测 pandoc</button>
          </div>
          <p class="settings-status" id="settings-status"></p>
          <div class="candidate-list" id="mineru-candidates"></div>
          <div class="candidate-list" id="pandoc-candidates"></div>
        </form>
      </section>

      <section class="admin-card">
        <div class="admin-card-head">
          <h2>用户管理</h2>
          <span class="muted">角色修改后，对方下一次请求即生效</span>
        </div>
        <div class="admin-table-wrap">
          <table class="admin-table">
            <thead>
              <tr>
                <th>ID</th><th>用户名</th><th>角色</th><th>文档数</th><th>任务数</th><th>最近活跃</th>
              </tr>
            </thead>
            <tbody id="admin-user-rows"></tbody>
          </table>
        </div>
        <form id="create-user-form" class="create-user">
          <input name="username" placeholder="新用户名" minlength="3" maxlength="32" required />
          <input name="password" type="password" placeholder="初始密码（至少 6 位）" minlength="6" required />
          <select name="role">
            <option value="user">普通用户</option>
            <option value="admin">管理员</option>
          </select>
          <button type="submit" class="ghost-btn">新建用户</button>
        </form>
        <p class="error" id="admin-user-error" hidden></p>
      </section>

      <section class="admin-card">
        <div class="admin-card-head">
          <h2>全部任务</h2>
          <span class="muted">点击行查看只读摘要与报告</span>
        </div>
        <div class="admin-table-wrap">
          <table class="admin-table">
            <thead>
              <tr>
                <th>ID</th><th>用户</th><th>查询内容</th><th>事件数</th><th>状态</th><th>时间</th>
              </tr>
            </thead>
            <tbody id="admin-task-rows"></tbody>
          </table>
        </div>
        <div class="admin-detail" id="admin-task-detail" hidden>
          <div class="admin-card-head">
            <h3 id="admin-detail-title"></h3>
            <button type="button" class="ghost-btn" id="admin-detail-close">关闭</button>
          </div>
          <p class="summary-text" id="admin-detail-summary"></p>
          <ul class="admin-event-list" id="admin-detail-events"></ul>
          <div class="admin-report" id="admin-detail-report"></div>
        </div>
      </section>
    </div>
  </section>

  <section class="report-screen" id="report-screen" hidden>
    <header class="report-head">
      <button type="button" class="ghost-btn" id="report-back">← 返回</button>
      <strong>分析报告</strong>
      <div class="report-actions">
        <button type="button" class="primary-btn" id="report-save">保存</button>
        <a class="ghost-btn" id="report-export" href="#">下载 DOC</a>
      </div>
    </header>
    <p class="muted" id="report-status"></p>
    <div class="report-grid">
      <textarea id="report-editor" spellcheck="false" placeholder="报告内容将在这里显示，可直接编辑 Markdown。"></textarea>
      <div class="report-split" data-resize="report" title="拖动调整分栏"></div>
      <article class="report-preview" id="report-preview"></article>
    </div>
  </section>

  <div class="modal center" id="account-modal" hidden>
    <div class="modal-card">
      <h2>注销与密码</h2>
      <form id="password-form" class="stack">
        <input name="old_password" type="password" placeholder="旧密码" required />
        <input name="new_password" type="password" placeholder="新密码（至少 6 位）" minlength="6" required />
        <input name="confirm_password" type="password" placeholder="确认新密码" minlength="6" required />
        <button type="submit" class="primary-btn">修改密码</button>
      </form>
      <p class="error" id="password-error" hidden></p>
      <div class="modal-actions">
        <button type="button" class="danger-btn" id="delete-account">注销账号</button>
        <button type="button" class="ghost-btn" id="account-modal-close">关闭</button>
      </div>
    </div>
  </div>

  <script src="/static/app.js?v=27"></script>
  <script src="/static/resize.js?v=27"></script>
  <script src="/static/auth.js?v=27"></script>
  <script src="/static/views/history.js?v=27"></script>
  <script src="/static/views/upload.js?v=27"></script>
  <script src="/static/views/records.js?v=27"></script>
  <script src="/static/views/reader.js?v=27"></script>
  <script src="/static/views/report.js?v=27"></script>
  <script src="/static/views/account.js?v=27"></script>
  <script src="/static/views/personal.js?v=27"></script>
  <script src="/static/views/admin.js?v=27"></script>
</body>
</html>
